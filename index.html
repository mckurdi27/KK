<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kitaplık</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;background:#1a1a2e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#eee;overflow:hidden}

  /* SHELF */
  #shelf-view{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:radial-gradient(1200px 600px at 50% -10%,#24304f 0%,#16213e 45%,#0f1730 100%)}
  #shelf-header{padding:16px 18px 12px;position:sticky;top:0;z-index:10;
    background:rgba(15,23,48,.9);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.08)}
  #shelf-header h1{font-size:19px;font-weight:600}
  #shelf-header h1 span{color:#e67e22}
  .hint{color:#8892b0;font-size:12px;margin-top:4px}

  #picker-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  #picker-bar button{
    flex:1 1 auto;min-width:110px;
    background:#e67e22;color:#fff;border:none;
    padding:11px 12px;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;
    box-shadow:0 3px 10px rgba(230,126,34,.3);
  }
  #picker-bar button:hover{background:#d35400}
  #picker-bar button.sec{background:rgba(255,255,255,.14);box-shadow:none;border:1px solid rgba(255,255,255,.18)}
  #picker-bar button.sec:hover{background:rgba(255,255,255,.24)}

  #shelf{padding:22px 18px 70px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:26px 16px}

  .book{cursor:pointer;display:flex;flex-direction:column;gap:8px;
    transition:transform .25s;animation:fadeUp .4s ease backwards}
  .book:active{transform:scale(.97)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .book-cover{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;
    background:linear-gradient(135deg,#2d3561,#1f2544);
    box-shadow:0 10px 22px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);
    display:flex;align-items:center;justify-content:center}
  .book-cover::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(0,0,0,.35) 0,rgba(0,0,0,0) 8%,rgba(255,255,255,.05) 92%,rgba(255,255,255,.14) 100%)}
  .book-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .book-cover .placeholder{color:#5a6a9a;font-size:42px;opacity:.8}
  .book-badge{position:absolute;top:7px;right:7px;background:rgba(230,126,34,.95);color:#fff;
    font-size:9px;font-weight:800;letter-spacing:.6px;padding:3px 6px;border-radius:4px;z-index:2}
  .book-badge.img{background:rgba(39,174,96,.95)}
  .book-title{font-size:12px;font-weight:500;text-align:center;color:#cfd6e6;
    line-height:1.3;word-break:break-word;min-height:30px}
  .book-pages{font-size:10px;color:#6b7794;text-align:center;margin-top:-4px}

  #empty-msg{padding:40px 22px;text-align:center;color:#7a8ab0;font-size:14px;line-height:1.8}
  #empty-msg code{background:rgba(255,255,255,.08);padding:2px 7px;border-radius:4px;
    font-family:ui-monospace,monospace;color:#e67e22}
  #empty-msg .small{font-size:11px;color:#556;margin-top:14px}

  /* MODAL — Tek/Çift seçim */
  #mode-modal{position:fixed;inset:0;z-index:2147483600;
    background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;padding:20px}
  #mode-modal.show{display:flex}
  #mode-modal .modal-box{
    background:linear-gradient(160deg,#24304f,#16213e);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;padding:26px 22px 20px;
    max-width:420px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.7);
    text-align:center;
    animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  #mode-modal h3{font-size:17px;font-weight:600;color:#fff;margin-bottom:6px}
  #mode-modal .mode-book-title{
    font-size:12px;color:#8892b0;margin-bottom:20px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    padding:0 6px}
  #mode-modal .modal-buttons{display:flex;gap:12px;flex-wrap:wrap}
  #mode-modal .modal-buttons button{
    flex:1 1 140px;
    padding:16px 12px;border:none;border-radius:10px;
    font-size:14px;font-weight:600;color:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:transform .15s,background .15s}
  #mode-modal .modal-buttons button:active{transform:scale(.96)}
  #mode-modal .modal-buttons button .ico{font-size:26px;line-height:1}
  #mode-modal .modal-buttons button .lbl{font-size:13px}
  #mode-modal .modal-buttons button .sub{font-size:10px;opacity:.75;font-weight:400}
  #mode-single{background:#3b4a7a}
  #mode-single:hover{background:#4a5c95}
  #mode-double{background:#8e44ad}
  #mode-double:hover{background:#a05bc0}
  #mode-modal .modal-remember{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:18px;font-size:12px;color:#8892b0;cursor:pointer;user-select:none}
  #mode-modal .modal-remember input{
    accent-color:#e67e22;width:15px;height:15px;cursor:pointer}
  #mode-modal .modal-cancel{
    background:transparent;border:none;color:#6b7794;
    font-size:12px;margin-top:12px;cursor:pointer;padding:6px}
  #mode-modal .modal-cancel:hover{color:#aab}

  /* READER */
  #reader-view{position:fixed;inset:0;background:#2c3e50;display:none;z-index:100}
  #reader-view.active{display:block}

  #top-bar,#bottom-bar{position:fixed;left:0;right:0;background:rgba(0,0,0,.92);
    display:flex;align-items:center;justify-content:center;gap:6px;z-index:2147483647;
    padding:0 8px}
  #top-bar{top:0;height:50px}
  #bottom-bar{bottom:0;height:60px}

  #top-bar button,#bottom-bar button{
    background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2);
    padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;
    white-space:nowrap}
  #top-bar button:hover,#bottom-bar button:hover:not(:disabled){background:rgba(255,255,255,.28)}
  #bottom-bar button:disabled{opacity:.35;cursor:not-allowed}
  #top-bar button.active{background:#27ae60;border-color:#27ae60}
  #back-btn{background:#e67e22!important;border-color:#e67e22!important}
  #view-btn{background:#8e44ad!important;border-color:#8e44ad!important}

  #reader-title{color:#ddd;font-size:12px;max-width:180px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;padding:0 4px;flex:1;text-align:center}

  #book-area{position:fixed;top:50px;bottom:60px;left:0;right:0;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #rtl-wrapper{transform-origin:center center;transition:transform .2s;will-change:transform}
  #rtl-wrapper.rtl-mode{transform:scaleX(-1)}
  #rtl-wrapper.rtl-mode .page{transform:scaleX(-1)}
  #book-container{box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .page{background:#fff}
  .page canvas,.page img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
  .page .loading-page{display:flex;align-items:center;justify-content:center;
    height:100%;background:#ecf0f1;color:#7f8c8d;font-size:14px}

  .stf__outerShadow,.stf__innerShadow,.stf__hardShadow,
  .stf__block>canvas,.stf__parent>canvas,
  div[class*="stf__shadow"],div[class*="stf__progress"],.stf__loader{
    display:none!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important}
  .stf__item{filter:none!important}
  .stf__item::before,.stf__item::after{display:none!important}

  #page-indicator{display:flex;align-items:center;gap:2px;padding:4px 10px;
    background:rgba(255,255,255,.1);border-radius:6px;min-width:80px}
  #page-input{width:38px;text-align:center;background:transparent;border:none;color:#fff;
    font-family:ui-monospace,monospace;font-size:14px;font-weight:700;outline:none;padding:4px 0}
  #page-input:focus{background:rgba(255,255,255,.2);border-radius:4px}
  #page-total{color:#aaa;font-family:ui-monospace,monospace;font-size:13px}

  #status{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);
    color:#ccc;font-size:11px;background:rgba(0,0,0,.7);padding:4px 10px;border-radius:4px;
    z-index:2147483647;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
  #reader-loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.92);color:#fff;padding:14px 26px;border-radius:8px;font-size:14px;
    z-index:2147483647;display:none}
  #toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    background:rgba(230,126,34,.95);color:#fff;padding:8px 16px;border-radius:6px;
    font-size:13px;z-index:2147483647;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.show{opacity:1}

  @media (max-width:520px){
    #reader-title{display:none}
    #top-bar button,#bottom-bar button{padding:7px 9px;font-size:11px}
    #shelf{padding:18px 14px 70px;gap:22px 12px;
      grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    #shelf-header h1{font-size:17px}
    #mode-modal .modal-buttons button{padding:14px 8px}
  }
</style>

<div id="mode-modal">
  <div class="modal-box">

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ============ Yardımcılar ============ */
const IMG_RE = /\.(jpe?g|png|gif|webp|bmp|avif|heic|heif)$/i;
const PDF_RE = /\.pdf$/i;
const $ = id => document.getElementById(id);
const toastEl = $('toast');
let toastTimer = null;
function toast(msg, ms=1800){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), ms);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sortNames(a){
  return a.slice().sort((x,y)=>x.localeCompare(y,undefined,{numeric:true,sensitivity:'base'}));
}

/* ============ Klasör listeleme (yalnız sunucuda çalışır) ============ */
async function listDir(url){
  try{
    const res = await fetch(url,{cache:'no-store'});
    if(!res.ok) return null;
    const text = await res.text();
    if(!/<a\s/i.test(text)) return null;
    const doc = new DOMParser().parseFromString(text,'text/html');
    const out = new Set();
    doc.querySelectorAll('a[href]').forEach(a=>{
      let h = a.getAttribute('href'); if(!h) return;
      h = h.split('#')[0].split('?')[0];
      if(!h || h==='../' || h==='..' || h==='./') return;
      if(h.startsWith('http')||h.startsWith('/')||h.startsWith('?')) return;
      out.add(decodeURIComponent(h.replace(/\/$/,'')));
    });
    return [...out];
  }catch(e){ return null; }
}

/* ============ PDF açma ============ */
async function openPdfDoc(book){
  if(book.file){
    const buf = await book.file.arrayBuffer();
    return pdfjsLib.getDocument({data:buf}).promise;
  }
  return pdfjsLib.getDocument(book.src).promise;
}

/* ============ KAPAK ============ */
async function makeCover(book){
  try{
    if(book.type==='images'){
      const p = book.pages[0];
      return (typeof p==='string') ? p : URL.createObjectURL(p);
    }
    const pdf = await openPdfDoc(book);
    const page = await pdf.getPage(1);
    const vp = page.getViewport({scale:0.4});
    const c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    try{ pdf.destroy(); }catch(e){}
    return c.toDataURL('image/jpeg',0.72);
  }catch(e){
    console.warn('Kapak üretilemedi:', book.title, e);
    return null;
  }
}

/* ============ RAF ============ */
const shelfEl = $('shelf');
const emptyEl = $('empty-msg');
let allBooks = [];

function renderShelf(books){
  allBooks = books;
  shelfEl.innerHTML = '';
  if(!books.length){
    emptyEl.style.display = 'block';
    emptyEl.innerHTML = `
      <p><b>Henüz kitap eklenmedi.</b></p>
      <p style="margin-top:12px">Yukarıdaki <b>📄 PDF Seç</b> veya <b>🖼️ Albüm Seç</b> butonlarıyla
      telefonundan dosya/fotoğraf seçebilirsin.</p>
      <p class="small">
        Bilgisayarda web sunucusu (Live Server / <code>python -m http.server</code>) kullanıyorsan
        <code>pdf/</code> ve <code>img/</code> klasörleri otomatik taranır.
      </p>`;
    return;
  }
  emptyEl.style.display = 'none';

  books.forEach((book,idx)=>{
    const el = document.createElement('div');
    el.className = 'book';
    el.style.animationDelay = Math.min(idx*30,500)+'ms';
    el.innerHTML = `
      <div class="book-cover">
        <div class="placeholder">${book.type==='pdf'?'📄':'🖼️'}</div>
        <span class="book-badge ${book.type==='images'?'img':''}">
          ${book.type==='pdf'?'PDF':'RESİM'}
        </span>
      </div>
      <div class="book-title">${escapeHtml(book.title)}</div>
      <div class="book-pages">${book.type==='images'?book.pages.length+' sayfa':''}</div>`;
    el.addEventListener('click',()=>openBook(book));
    shelfEl.appendChild(el);

    makeCover(book).then(url=>{
      if(!url) return;
      const cover = el.querySelector('.book-cover');
      if(!cover) return;
      const ph = cover.querySelector('.placeholder');
      if(ph) ph.remove();
      const img = document.createElement('img');
      img.src = url; img.alt = book.title; img.loading = 'lazy';
      cover.insertBefore(img, cover.firstChild);
    });
  });
}

/* ============ OTOMATİK TARAMA ============ */
async function autoScan(){
  const books = [];
  try{
    const pdfs = await listDir('pdf/');
    if(pdfs){
      sortNames(pdfs).forEach(name=>{
        if(PDF_RE.test(name)){
          books.push({type:'pdf', title:name.replace(PDF_RE,''), src:'pdf/'+name});
        }
      });
    }
    const imgs = await listDir('img/');
    if(imgs){
      for(const name of sortNames(imgs)){
        if(/\.[a-z0-9]{2,5}$/i.test(name)) continue;
        const sub = await listDir('img/'+name+'/');
        if(!sub) continue;
        const files = sortNames(sub.filter(f=>IMG_RE.test(f)));
        if(files.length){
          books.push({
            type:'images',
            title:name,
            pages:files.map(f=>'img/'+name+'/'+f)
          });
        }
      }
    }
  }catch(e){ console.warn('autoScan:', e); }
  return books;
}

/* ============ MANUEL SEÇİCİ ============ */
$('btn-pick-pdf').addEventListener('click', ()=>$('pdf-input').click());
$('btn-pick-img').addEventListener('click', ()=>{
  if('webkitdirectory' in $('img-dir-input')){
    $('img-dir-input').click();
  }else{
    $('img-input').click();
  }
});
$('btn-refresh').addEventListener('click', async ()=>{
  toast('Taranıyor…');
  const auto = await autoScan();
  const manual = allBooks.filter(b=>b.file || b._manual);
  renderShelf([...manual, ...auto]);
  toast(auto.length ? `${auto.length} kitap bulundu` : 'Sunucu taraması boş');
});

$('pdf-input').addEventListener('change', e=>{
  const files = [...e.target.files].filter(f=>PDF_RE.test(f.name));
  if(!files.length){ toast('PDF seçilmedi'); return; }
  const newBooks = files.map(f=>({
    type:'pdf', title:f.name.replace(PDF_RE,''),
    file:f, _manual:true
  }));
  renderShelf([...allBooks, ...newBooks]);
  toast(files.length + ' PDF eklendi');
  e.target.value = '';
});

$('img-input').addEventListener('change', e=>{
  const files = [...e.target.files].filter(f=>IMG_RE.test(f.name));
  if(!files.length){ toast('Resim seçilmedi'); return; }
  const name = 'Albüm ' + (allBooks.filter(b=>b._manual && b.type==='images').length + 1);
  renderShelf([...allBooks, {
    type:'images', title:name, pages:files, _manual:true
  }]);
  toast(files.length + ' resim tek albüm olarak eklendi');
  e.target.value = '';
});

$('img-dir-input').addEventListener('change', e=>{
  const files = [...e.target.files].filter(f=>IMG_RE.test(f.name));
  if(!files.length){ toast('Resim bulunamadı'); return; }
  const groups = {};
  files.forEach(f=>{
    const parts = (f.webkitRelativePath||'').split('/');
    const key = parts.length>1 ? parts[0] : 'Albüm';
    (groups[key] = groups[key] || []).push(f);
  });
  const newBooks = Object.keys(groups).map(name=>({
    type:'images', title:name, pages:groups[name], _manual:true
  }));
  renderShelf([...allBooks, ...newBooks]);
  toast(newBooks.length + ' albüm eklendi');
  e.target.value = '';
});

/* ================================================================
   OKUYUCU
================================================================ */
const rtlWrapper   = $('rtl-wrapper');
const bookContainer = $('book-container');
const readerLoading = $('reader-loading');
const statusDiv    = $('status');
const rtlBtn       = $('rtl-btn');
const viewBtn      = $('view-btn');
const backBtn      = $('back-btn');
const firstBtn     = $('first-btn');
const prevBtn      = $('prev-btn');
const nextBtn      = $('next-btn');
const lastBtn      = $('last-btn');
const pageInput    = $('page-input');
const pageTotal    = $('page-total');
const shelfView    = $('shelf-view');
const readerView   = $('reader-view');
const readerTitle  = $('reader-title');

let isRTL = false;
let isSinglePage = true;
let pageFlip = null;
let currentBook = null;
let pageSize = {width:400,height:600};
let pageDivs = [];
let totalPages = 0;
let resizeLocked = false;
let firstBatchSize = 10;
let pdfDoc = null;
let pdfAspect = 1;
let pagesRendered = {};

/* ---------- Tek/Çift tercihini hatırla ---------- */
const MODE_KEY = 'reader-view-mode';       // 'single' | 'double'
const REMEMBER_KEY = 'reader-remember-mode'; // '1' | '0'

function getRememberedMode(){
  if(localStorage.getItem(REMEMBER_KEY) !== '1') return null;
  const m = localStorage.getItem(MODE_KEY);
  return (m === 'single' || m === 'double') ? m : null;
}
function saveMode(mode){
  localStorage.setItem(MODE_KEY, mode);
}
function isRememberOn(){
  return localStorage.getItem(REMEMBER_KEY) === '1';
}

/* ---------- Modal ---------- */
const modeModal   = $('mode-modal');
const modeTitle   = $('mode-book-title');
const modeRem     = $('mode-remember');
let pendingBook   = null;

function showModeModal(book){
  pendingBook = book;
  modeTitle.textContent = book.title;
  modeRem.checked = isRememberOn();
  modeModal.classList.add('show');
}
function hideModeModal(){
  modeModal.classList.remove('show');
  pendingBook = null;
}

$('mode-single').addEventListener('click', ()=>{
  isSinglePage = true;
  if(modeRem.checked){
    localStorage.setItem(REMEMBER_KEY,'1');
    saveMode('single');
  }else{
    localStorage.setItem(REMEMBER_KEY,'0');
  }
  const b = pendingBook;
  modeModal.classList.remove('show');
  pendingBook = null;
  if(b) startReading(b);
});
$('mode-double').addEventListener('click', ()=>{
  isSinglePage = false;
  if(modeRem.checked){
    localStorage.setItem(REMEMBER_KEY,'1');
    saveMode('double');
  }else{
    localStorage.setItem(REMEMBER_KEY,'0');
  }
  const b = pendingBook;
  modeModal.classList.remove('show');
  pendingBook = null;
  if(b) startReading(b);
});
$('mode-cancel').addEventListener('click', hideModeModal);
modeModal.addEventListener('click', e=>{
  if(e.target === modeModal) hideModeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && modeModal.classList.contains('show')) hideModeModal();
});

/* ---------- openBook: önce mod seçimini sor ---------- */
function openBook(book){
  const remembered = getRememberedMode();
  if(remembered){
    isSinglePage = remembered === 'single';
    startReading(book);
    return;
  }
  showModeModal(book);
}

/* ---------- Gerçek okuma başlatıcı ---------- */
async function startReading(book){
  currentBook = book;
  shelfView.style.display = 'none';
  readerView.classList.add('active');
  readerTitle.textContent = book.title;
  statusDiv.textContent = '';
  readerLoading.style.display = 'block';
  readerLoading.textContent = 'Yükleniyor…';
  isRTL = false; rtlBtn.classList.remove('active');
  updateViewButton();

  try{
    await reloadCurrentBook(0, true);
  }catch(e){
    console.error(e);
    readerLoading.textContent = 'Hata: ' + e.message;
    return;
  }
  readerLoading.style.display = 'none';
}

function calculatePageSize(aspect){
  const winW = window.innerWidth, winH = window.innerHeight;
  const paddingH = 130, paddingW = 40;
  const availW = winW - paddingW;
  const availH = winH - paddingH;
  const divisor = isSinglePage ? 1 : 2;
  const maxPageW = availW / divisor;
  const maxPageH = availH;
  let pageH = maxPageH;
  let pageW = pageH * aspect;
  if(pageW > maxPageW){ pageW = maxPageW; pageH = pageW / aspect; }
  return {width:Math.floor(pageW),height:Math.floor(pageH)};
}

function getFlipSettings(){
  return {
    width:pageSize.width, height:pageSize.height,
    size:'fixed', drawShadow:false, flippingTime:700, maxShadowOpacity:0,
    showCover: isSinglePage ? false : true,
    mobileScrollSupport:false, useMouseEvents:true, swipeDistance:30,
    clickEventForward:true,
    usePortrait: isSinglePage ? true : false,
    startZIndex:0, autoSize:false, showPageCorners:false, disableFlipByClick:false
  };
}

function initFlipbook(){
  if(pageFlip){ try{ pageFlip.destroy(); }catch(e){} pageFlip = null; }
  bookContainer.innerHTML = '';
  pageDivs.forEach(d=>bookContainer.appendChild(d));
  pageFlip = new St.PageFlip(bookContainer, getFlipSettings());
  pageFlip.loadFromHTML(pageDivs);
  pageFlip.on('flip', e=>updatePageIndicator(e.data));
  pageFlip.on('changeState', ()=>updateButtonStates());
  updatePageIndicator(0);
  updateButtonStates();
  applyRTLClass();
  updateViewButton();
}

function updatePageIndicator(idx){
  pageInput.value = idx + 1;
  pageTotal.textContent = ' / ' + totalPages;
}
function updateButtonStates(){
  if(!pageFlip){
    firstBtn.disabled = prevBtn.disabled = nextBtn.disabled = lastBtn.disabled = true;
    return;
  }
  const c = pageFlip.getCurrentPageIndex();
  firstBtn.disabled = prevBtn.disabled = c === 0;
  nextBtn.disabled = lastBtn.disabled = c >= totalPages - 1;
}
function updateViewButton(){
  viewBtn.textContent = isSinglePage ? 'Tek' : 'Çift';
  viewBtn.classList.toggle('active', !isSinglePage);
}
function applyRTLClass(){ rtlWrapper.classList.toggle('rtl-mode', isRTL); }

async function reloadCurrentBook(savedPage, showLoading){
  if(!currentBook) return;
  const book = currentBook;

  if(pageFlip){ try{ pageFlip.destroy(); }catch(e){} pageFlip = null; }
  bookContainer.innerHTML = '';
  pageDivs = []; pagesRendered = {}; pdfDoc = null; totalPages = 0;

  if(book.type === 'pdf') await loadPdfBook(book, showLoading);
  else await loadImageBook(book);

  if(savedPage > 0 && savedPage < totalPages){
    setTimeout(()=>{
      try{
        if(typeof pageFlip.turnToPage === 'function') pageFlip.turnToPage(savedPage);
        else pageFlip.flip(savedPage);
      }catch(e){}
    },220);
  }
}

async function loadPdfBook(book, showLoading){
  pdfDoc = await openPdfDoc(book);
  totalPages = pdfDoc.numPages;

  const fp = await pdfDoc.getPage(1);
  const vp = fp.getViewport({scale:1.0});
  pdfAspect = vp.width / vp.height;
  pageSize = calculatePageSize(pdfAspect);

  for(let i=1;i<=totalPages;i++){
    const div = document.createElement('div');
    div.className = 'page';
    div.style.width  = pageSize.width  + 'px';
    div.style.height = pageSize.height + 'px';
    div.innerHTML = '<div class="loading-page">Yükleniyor…</div>';
    pageDivs.push(div);
  }
  initFlipbook();

  const firstEnd = Math.min(firstBatchSize, totalPages);
  for(let i=1;i<=firstEnd;i++){
    if(showLoading) readerLoading.textContent = `Sayfa ${i} / ${totalPages}`;
    await renderPdfPage(i, pageDivs[i-1]);
  }
  statusDiv.textContent = `İlk ${firstEnd} sayfa hazır — ${isSinglePage?'Tek':'Çift'}`;
  if(totalPages > firstBatchSize) renderPdfRemaining(firstBatchSize+1, totalPages);
}

async function renderPdfPage(n, div){
  if(pagesRendered[n]) return;
  pagesRendered[n] = true;
  try{
    const page = await pdfDoc.getPage(n);
    const vp = page.getViewport({scale:2.0});
    const c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    div.innerHTML = ''; div.appendChild(c);
  }catch(e){
    console.error('Sayfa ' + n, e);
    div.innerHTML = '<div class="loading-page">Hata</div>';
  }
}

async function renderPdfRemaining(start,end){
  for(let i=start;i<=end;i++){
    if(pageDivs[i-1]){
      await renderPdfPage(i, pageDivs[i-1]);
      statusDiv.textContent = `Yükleniyor: ${i} / ${totalPages}`;
    }
    await new Promise(r=>setTimeout(r,8));
  }
  statusDiv.textContent = `Hazır — ${totalPages} sayfa`;
}

async function loadImageBook(book){
  totalPages = book.pages.length;
  const src0 = typeof book.pages[0] === 'string' ? book.pages[0] : URL.createObjectURL(book.pages[0]);
  const aspect = await getImageAspect(src0);
  pageSize = calculatePageSize(aspect);

  for(let i=0;i<totalPages;i++){
    const div = document.createElement('div');
    div.className = 'page';
    div.style.width  = pageSize.width  + 'px';
    div.style.height = pageSize.height + 'px';
    const img = document.createElement('img');
    img.src = typeof book.pages[i] === 'string' ? book.pages[i] : URL.createObjectURL(book.pages[i]);
    img.alt = 'Sayfa ' + (i+1);
    img.decoding = 'async';
    div.appendChild(img);
    pageDivs.push(div);
  }
  initFlipbook();
  statusDiv.textContent = `Hazır — ${totalPages} sayfa`;
}

function getImageAspect(src){
  return new Promise(res=>{
    const img = new Image();
    img.onload  = ()=>res((img.naturalWidth/img.naturalHeight)||0.75);
    img.onerror = ()=>res(0.75);
    img.src = src;
  });
}

backBtn.addEventListener('click', ()=>{
  readerView.classList.remove('active');
  shelfView.style.display = 'block';
  if(pageFlip){ try{ pageFlip.destroy(); }catch(e){} pageFlip = null; }
  bookContainer.innerHTML = '';
  pageDivs = []; pagesRendered = {}; pdfDoc = null; currentBook = null;
});

firstBtn.addEventListener('click', ()=>pageFlip && pageFlip.flip(0));
prevBtn .addEventListener('click', ()=>pageFlip && pageFlip.flipPrev());
nextBtn .addEventListener('click', ()=>pageFlip && pageFlip.flipNext());
lastBtn .addEventListener('click', ()=>pageFlip && pageFlip.flip(totalPages-1));

/* Reader içindeki Tek/Çift butonu — modu değiştirir, hatırla açıksa kaydeder */
viewBtn.addEventListener('click', ()=>{
  isSinglePage = !isSinglePage;
  updateViewButton();

  // hatırlama açıksa güncelle
  if(isRememberOn()){
    saveMode(isSinglePage ? 'single' : 'double');
  }

  if(!currentBook) return;
  const saved = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
  resizeLocked = true;
  reloadCurrentBook(saved, false).then(()=>setTimeout(()=>resizeLocked=false,400));
});

pageInput.addEventListener('focus', ()=>pageInput.select());
pageInput.addEventListener('keydown', e=>{
  if(e.key !== 'Enter') return;
  e.preventDefault(); e.stopPropagation();
  const t = parseInt(pageInput.value,10);
  if(isNaN(t) || t<1 || t>totalPages){
    updatePageIndicator(pageFlip ? pageFlip.getCurrentPageIndex() : 0);
    pageInput.blur(); return;
  }
  pageInput.blur();
  resizeLocked = true;
  setTimeout(()=>{
    if(pageFlip){
      const c = pageFlip.getCurrentPageIndex();
      const diff = Math.abs(t-1-c);
      try{
        if(diff <= 2) pageFlip.flip(t-1);
        else if(typeof pageFlip.turnToPage === 'function') pageFlip.turnToPage(t-1);
        else pageFlip.flip(t-1);
      }catch(e){ console.error(e); }
    }
    setTimeout(()=>resizeLocked=false,300);
  },80);
});

rtlBtn.addEventListener('click', ()=>{
  isRTL = !isRTL;
  rtlBtn.classList.toggle('active', isRTL);
  applyRTLClass();
  statusDiv.textContent = isRTL ? 'RTL — sağdan sola' : 'LTR — soldan sağa';
});

document.addEventListener('keydown', e=>{
  if(!readerView.classList.contains('active')) return;
  if(!pageFlip) return;
  if(document.activeElement === pageInput) return;
  if(e.key === 'Escape'){ backBtn.click(); return; }
  if(e.key === 'ArrowLeft')  isRTL ? nextBtn.click() : prevBtn.click();
  if(e.key === 'ArrowRight') isRTL ? prevBtn.click() : nextBtn.click();
  if(e.key === 'Home') firstBtn.click();
  if(e.key === 'End')  lastBtn.click();
});

let resizeTimer = null, lastW = window.innerWidth, lastH = window.innerHeight;
window.addEventListener('resize', ()=>{
  if(!readerView.classList.contains('active')) return;
  if(resizeLocked){ lastW = window.innerWidth; lastH = window.innerHeight; return; }
  const nw = window.innerWidth, nh = window.innerHeight;
  if(Math.abs(nw-lastW) < 10){ lastH = nh; return; }
  lastW = nw; lastH = nh;
  if(resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    if(currentBook && !resizeLocked){
      const saved = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
      reloadCurrentBook(saved, false);
    }
  },500);
});

/* ============ BAŞLAT ============ */
(async function boot(){
  shelfEl.innerHTML =
    '<div style="grid-column:1/-1;text-align:center;padding:60px 10px;color:#6b7794;font-size:13px">' +
    'Kitaplık taranıyor…</div>';

  const isFile = location.protocol === 'file:';

  if(isFile){
    renderShelf([]);
    toast('Telefonda "PDF Seç" veya "Albüm Seç" kullan', 3200);
    return;
  }

  const auto = await autoScan();
  renderShelf(auto);
  if(auto.length) toast(auto.length + ' kitap bulundu');
})();
</script>
